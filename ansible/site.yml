---
- name: Single host all-in-one
  hosts: all
  become: true

  tasks:
    - name: Base config
      import_tasks: tasks/base.yml
      tags: base

    - name: Configure sysctl
      import_tasks: tasks/sysctl.yml
      tags: sysctl

    - name: Configure iptables
      import_tasks: tasks/iptables.yml
      tags: iptables

    - name: Configure fail2ban
      import_tasks: tasks/fail2ban.yml
      tags: fail2ban

    - name: Configure users
      import_tasks: tasks/users.yml
      tags: users

    - name: Certbot
      import_tasks: tasks/certbot.yml
      tags: certbot

    - name: Work with files and dirs
      import_tasks: tasks/files.yml
      tags: files

  handlers:
    - name: Reload sysctl
      command: sysctl --system

    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted
